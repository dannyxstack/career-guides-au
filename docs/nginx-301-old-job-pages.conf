# 301 重定向：旧职业详情页 → 新分类前缀职业页
# ---------------------------------------------------------------------------
# 背景：职业详情页 URL 从 /{cc}/{locale}/{cat}/{slug}/ 迁移到分类前缀新页
#       （en 裸 /{cat}/{slug}/{cc}/，其余 /{locale}/{cat}/{slug}/{cc}/）。
#       旧的国家嵌套路由已从 Astro 删除（约 4.9 万页），旧 URL 已被搜索引擎
#       收录，故在 host 层做 301 兜底，避免大面积 404、保住 SEO 权重。
#
# 映射规则：国家码从首段移到末段；en 去掉语言段，其余保留语言前缀。
#   旧 /{cc}/en/{cat}/{slug}/       -> 新 /{cat}/{slug}/{cc}/
#   旧 /{cc}/{loc}/{cat}/{slug}/    -> 新 /{loc}/{cat}/{slug}/{cc}/   (loc != en)
#
# 放到对应 server{} 块内，且必须在通用 location / 之前（先匹配先生效）。
# 注意：compare 页仍存活且 URL 同形（/{cc}/{loc}/compare/{pair}/），
#       已用负向前瞻排除，勿删该排除条件。
# ---------------------------------------------------------------------------

# 非 en：/{cc}/{loc}/{cat}/{slug}/ -> /{loc}/{cat}/{slug}/{cc}/
location ~ ^/(AU|NZ|CA|US|UK|DE|FR|ES)/(zh-CN|zh-Hant|es|pt|vi|th|ms|id|ja|de)/(?!compare/)([^/]+)/([^/]+)/?$ {
    return 301 /$2/$3/$4/$1/;
}

# en：/{cc}/en/{cat}/{slug}/ -> /{cat}/{slug}/{cc}/
location ~ ^/(AU|NZ|CA|US|UK|DE|FR|ES)/en/(?!compare/)([^/]+)/([^/]+)/?$ {
    return 301 /$2/$3/$1/;
}
