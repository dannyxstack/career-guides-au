# 301 重定向：job-treemap（aijobriskmap.com）URL 迁移
# ---------------------------------------------------------------------------
# 背景：国家页 URL 从根级 /{slug}/ 迁移到 /country/{slug}/（加 hub 前缀）。
#       旧 URL 已被搜索引擎收录，故在 host 层做 301，避免 404、保住 SEO 权重。
#       注：/about.html 仍是独立页（“关于”），不再 301 到 methodology。
#
# 放到 aijobriskmap.com 的 server{} 块内，且必须在通用 location / 之前。
# 注意：新页在 /country/... 之下，这些精确匹配不会误伤新 URL。
# ---------------------------------------------------------------------------

# 让 /embed/* 可被任意站点 iframe：不要设 X-Frame-Options（其无 ALLOWALL 值），
# 改用 CSP frame-ancestors。其余路径保持默认（可 SAMEORIGIN）。
location ^~ /embed/ {
    add_header Content-Security-Policy "frame-ancestors *" always;
    # 若别处全局设了 X-Frame-Options，这里需覆盖为空：
    # proxy_hide_header X-Frame-Options;  # 反代时
}

# 旧根级国家页 /{slug}/ -> /country/{slug}/
location = /australia/      { return 301 /country/australia/; }
location = /united-states/  { return 301 /country/united-states/; }
location = /united-kingdom/ { return 301 /country/united-kingdom/; }
location = /canada/         { return 301 /country/canada/; }
location = /new-zealand/    { return 301 /country/new-zealand/; }
location = /japan/          { return 301 /country/japan/; }
location = /south-korea/    { return 301 /country/south-korea/; }
location = /germany/        { return 301 /country/germany/; }
location = /france/         { return 301 /country/france/; }
location = /spain/          { return 301 /country/spain/; }
location = /italy/          { return 301 /country/italy/; }
location = /netherlands/    { return 301 /country/netherlands/; }
location = /ireland/        { return 301 /country/ireland/; }

# 兜底：任何旧大写国家码目录（更早布局）-> 根，交由 landing 处理
# （可选，视历史入站链接而定）
