# 线上已有反向代理(nginx/Traefik/Caddy)负责 TLS+域名，
# 本服务只对外暴露一个 HTTP 端口，由代理 upstream 指向它。
services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 部署时设置 SITE_URL=https://真实域名（见 .env 或命令行）。
        SITE_URL: ${SITE_URL:-https://example.com}
    image: career-guides-site:latest
    container_name: career-guides-site
    restart: unless-stopped
    # 仅监听宿主机回环，交给前置代理转发；如需局域网直连改为 "8080:8080"。
    ports:
      - "127.0.0.1:8080:8080"
