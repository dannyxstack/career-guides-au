# 由反向代理(TLS/域名)转发到本容器的 8080；本配置只做静态托管。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 让上游代理拿到真实方案/主机（不在此处处理 TLS）。
    absolute_redirect off;

    # Astro build.format=directory：每页是 /path/index.html。
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    # 自定义 404。
    error_page 404 /404.html;

    # 带指纹的静态资源(_astro/*) 长缓存。
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 站点数据/图片等其他静态资源中等缓存。
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML 不缓存，确保内容更新即时生效。
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # gzip（静态资源体积大，translations 等 JSON 收益明显）。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;
    gzip_vary on;

    # 基础安全头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
