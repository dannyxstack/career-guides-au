<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}职业视频流水线{% endblock %}</title>
  <style>
    :root { --bg:#0b1120; --card:#151c2c; --line:#26304a; --fg:#e6ebf5; --mut:#8b97b0;
            --green:#10b981; --amber:#f59e0b; --blue:#3b82f6; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg);
           color:var(--fg); line-height:1.6; }
    header { padding:16px 28px; border-bottom:1px solid var(--line); display:flex;
             align-items:center; gap:16px; }
    header h1 { font-size:18px; margin:0; }
    header a { color:var(--mut); text-decoration:none; font-size:14px; }
    main { max-width:1100px; margin:0 auto; padding:28px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:18px 20px; margin-bottom:16px; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line);
            font-size:14px; }
    th { color:var(--mut); font-weight:600; }
    .btn { display:inline-block; padding:7px 14px; border-radius:8px; border:none;
           font-size:13px; cursor:pointer; text-decoration:none; color:#fff;
           background:var(--blue); }
    .btn.green { background:var(--green); } .btn.amber { background:var(--amber); color:#1b1300; }
    .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
    .tag { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line);
           color:var(--mut); }
    .tag.reviewing { color:var(--amber); border-color:var(--amber); }
    .tag.approved { color:var(--green); border-color:var(--green); }
    .tag.published { color:var(--blue); border-color:var(--blue); }
    select,input,textarea { background:#0e1626; color:var(--fg); border:1px solid var(--line);
            border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit; }
    textarea { width:100%; min-height:280px; font-family:ui-monospace,monospace; }
    .err { background:#3b1d1d; border:1px solid #7f1d1d; color:#fecaca; padding:10px 14px;
           border-radius:8px; margin-bottom:16px; font-size:13px; }
    .muted { color:var(--mut); font-size:13px; }
    .scene { border-left:3px solid var(--green); padding:6px 14px; margin:10px 0;
             background:#0e1626; border-radius:0 8px 8px 0; }
    .scene .meta { color:var(--mut); font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>🎬 职业视频流水线</h1>
    <a href="/">职业列表</a>
  </header>
  <main>
    {% if request.query_params.get('err') %}
      <div class="err">⚠️ {{ request.query_params.get('err') }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
